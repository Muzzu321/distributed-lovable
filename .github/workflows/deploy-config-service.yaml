name: Deploy Config Service

on:
  push:
    branches:
      - main
    paths:
      - 'config-service/**'

env:
  SERVICE_NAME: config-service
  IMAGE_NAME: muzammil7961/lovable-config-service

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Build and Push Docker Image using Google Jib
      - name: Build and Push Docker Image with Jib
        working-directory: ./${{ env.SERVICE_NAME }}
        run: |
          chmod +x mvnw
          ./mvnw compile jib:build \
            -Djib.to.image=docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -Djib.to.tags=latest \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Workflow completed
      - name: Build Completed
        run: echo "${{ env.SERVICE_NAME }} Docker image pushed successfully to Docker Hub."